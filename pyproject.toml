[project]
name = "taskflow"
version = "0.1.0"
description = "A small dependency-aware concurrent task runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
taskflow = "app.v0.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
